name: Build LANMinecraft.exe

on:
  push:
    branches:
      - main

concurrency:
  group: minecraft-latest-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The release number is the commit count, so the whole history has
          # to be here - a shallow clone would count one.
          fetch-depth: 0

      - name: Find .NET
        id: dotnet
        shell: pwsh
        run: |
          # The image already carries several 10.0.x SDKs and global.json takes
          # the newest of them. Downloading one more is a minute that stands
          # between a push and the players; the step below is the way back if
          # an image ever ships without one.
          $installed = @(& dotnet --list-sdks | Where-Object { $_ -match '^10\.0\.' })
          if ($installed) {
            Write-Host "Using a preinstalled .NET SDK: $($installed[-1])"
          } else {
            Write-Host "No 10.0.x SDK is installed here; one will be downloaded."
          }
          $answer = if ($installed) { 'true' } else { 'false' }
          "preinstalled=$answer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup .NET
        if: steps.dotnet.outputs.preinstalled != 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release is named after the commit it is built from: the number is
          # how many commits main carries, so a version in a bug report points
          # straight at a line of history.
          $commitNumber = [int](git rev-list --count HEAD)
          if ($commitNumber -lt 1) { throw "The commit count could not be determined." }
          # The launcher shows a hand-written history; a build whose number that
          # history does not know is not ready to ship. Asked first, so a
          # missing entry costs a second instead of a whole build.
          $changelogPath = Join-Path $env:GITHUB_WORKSPACE 'Program\Changelog.md'
          $changelogPattern = '(?m)^## {0}\s*$' -f $commitNumber
          if ((Get-Content -LiteralPath $changelogPath -Raw) -notmatch $changelogPattern) {
            throw ("Program/Changelog.md has no entry for release $commitNumber. " +
                   "Add a '## $commitNumber' section with a line or two in Russian describing this commit, then push again.")
          }

          # Three errands that do not need each other: fetching the releases a
          # delta will be built against is network, restoring is disk, and the
          # delta tool is a small build of its own. Together they cost what the
          # slowest one costs.
          $basesFile = Join-Path $env:RUNNER_TEMP 'minecraft-delta-bases.json'
          $capture = Start-Job -Name 'capture' -ScriptBlock {
            param($script, $commitNumber, $sha, $basesFile, $workDirectory, $repository)
            & $script -CommitNumber $commitNumber -CommitSha $sha -BasesFile $basesFile `
              -WorkDirectory $workDirectory -Repository $repository
          } -ArgumentList (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\Capture-PreviousRelease.ps1'),
                          $commitNumber, '${{ github.sha }}', $basesFile, $env:RUNNER_TEMP,
                          '${{ github.repository }}'
          $tool = Start-Job -Name 'delta tool' -ScriptBlock {
            param($workspace)
            Set-Location -LiteralPath $workspace
            & dotnet restore Program\Patch\DeltaPatchTool.csproj -p:Configuration=Release
            if ($LASTEXITCODE -ne 0) { throw "The delta tool could not be restored." }
            & dotnet build Program\Patch\DeltaPatchTool.csproj -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "The delta tool could not be built." }
          } -ArgumentList $env:GITHUB_WORKSPACE

          # Restore is also the dependency audit: NuGetAudit in
          # Directory.Build.props turns a vulnerable package, direct or
          # transitive, into a restore error.
          & dotnet restore tools\PortabilityAuditHost\PortabilityAuditHost.csproj -r win-x64 -p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { throw "The updater test host could not be restored." }
          & dotnet restore Program\Minecraft.csproj -r win-x64 -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw "The launcher could not be restored." }
          & dotnet restore Program.Tests\Program.Tests.csproj -r win-x64 -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw "The tests could not be restored." }

          $jobs = @($capture, $tool)
          Wait-Job -Job $jobs | Out-Null
          $captured = Receive-Job -Job $capture -ErrorAction Continue
          Receive-Job -Job $tool -ErrorAction Continue
          foreach ($job in $jobs) {
            if ($job.State -eq 'Failed') {
              throw "Preparing the release failed in '$($job.Name)': $($job.ChildJobs[0].JobStateInfo.Reason.Message)"
            }
          }
          Remove-Job -Job $jobs

          # The job answers with one object; anything else it printed is a
          # diagnostic and not the answer.
          $previous = @($captured) |
            Where-Object { $null -ne $_ -and $null -ne $_.HasPrevious } |
            Select-Object -Last 1
          if ($null -eq $previous) { throw "The previous release could not be captured." }

          "DELTA_BASES_FILE=$basesFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NUMBER=$([int]$previous.ReleaseNumber)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($previous.HasPrevious) {
            "HAS_PREVIOUS=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PREVIOUS_EXE=$($previous.PreviousExe)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PREVIOUS_MANIFEST=$($previous.PreviousManifest)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PREVIOUS_COMMIT=$($previous.PreviousCommit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PREVIOUS_SHA256=$($previous.PreviousSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PREVIOUS_RELEASE_NUMBER=$([int]$previous.PreviousReleaseNumber)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "HAS_PREVIOUS=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Test and publish
        shell: pwsh
        run: |
          # Debug and Release share Java JARs and their build-state files in
          # Program/Build. Finish tests before publishing so neither build
          # replaces an agent or writes its state while the other uses it.
          $ErrorActionPreference = 'Stop'
          & .\Program.Tests\Test-Launcher.ps1 -Profile Release -Configuration Debug -NoRestore
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }

          .\Program\Publish.ps1 `
            -SourceRevisionId "${{ github.sha }}" `
            -ReleaseNumber "$env:RELEASE_NUMBER" `
            -PublishDir "${{ github.workspace }}\artifacts" `
            -NoRestore `
            -KeepBuildOutput

          if ($LASTEXITCODE -ne 0) { throw "Publishing failed." }

      - name: Test hosted Defender publication policy
        shell: pwsh
        run: ./.github/scripts/Test-HostedDefenderPolicy.ps1

      - name: Scan portable host
        id: antivirus
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Program\Bootstrap\Test-PortableHostAntivirus.ps1 `
            -ExecutablePath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\LANMinecraft.exe') `
            -ArtifactsDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts\portable-host-antivirus')

      - name: Create delta and update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $exe = Join-Path $artifactDir 'LANMinecraft.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Published LANMinecraft.exe was not found: $exe"
          }

          # Keeping the executable this release replaces is upload bandwidth
          # and the deltas below are processor, so the archive rides along
          # here. The publish still waits for it: a base that was never kept
          # is a chain that breaks two releases later.
          $archive = $null
          if ($env:HAS_PREVIOUS -eq 'true' -and $env:PREVIOUS_COMMIT -ne '${{ github.sha }}') {
            $archive = Start-Job -Name 'archive' -ScriptBlock {
              param($script, $number, $exe, $manifest, $sha, $repository)
              & $script -ReleaseNumber $number -ExecutablePath $exe -ManifestPath $manifest `
                -CommitSha $sha -Repository $repository
            } -ArgumentList (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\Archive-PreviousBase.ps1'),
                            ([int]$env:PREVIOUS_RELEASE_NUMBER), $env:PREVIOUS_EXE, $env:PREVIOUS_MANIFEST,
                            '${{ github.sha }}', '${{ github.repository }}'
          }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $exe).Length
          $bases = @(
            Get-Content -LiteralPath $env:DELTA_BASES_FILE -Raw |
              ConvertFrom-Json |
              Where-Object { $null -ne $_ }
          ) | Select-Object -First 2

          # bsdiff over 66 MB is a minute of one core, and there are two bases
          # and more than two cores. The tool was built in Prepare, so it is
          # run straight from its assembly rather than through dotnet run,
          # which would build it again for every invocation.
          $tool = Join-Path $env:GITHUB_WORKSPACE 'Program\Patch\bin\Release\net10.0\DeltaPatchTool.dll'
          if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
            throw "The delta tool was not built: $tool"
          }
          $deltaJobs = @()
          for ($index = 0; $index -lt $bases.Count; $index++) {
            $base = $bases[$index]
            $assetName = if ($index -eq 0) {
              'LANMinecraft.bsdiff'
            } else {
              "LANMinecraft.from-$($base.releaseNumber).bsdiff"
            }
            $deltaJobs += Start-Job -Name "delta from $($base.releaseNumber)" -ScriptBlock {
              param($tool, $basePath, $baseNumber, $exe, $patch, $roundTrip, $hash, $size)
              & dotnet $tool create $basePath $exe $patch
              if ($LASTEXITCODE -ne 0) { throw "Delta patch generation failed for release $baseNumber." }

              & dotnet $tool apply $basePath $patch $roundTrip
              if ($LASTEXITCODE -ne 0) { throw "Delta patch roundtrip failed for release $baseNumber." }

              $roundTripHash = (Get-FileHash -LiteralPath $roundTrip -Algorithm SHA256).Hash.ToLowerInvariant()
              $roundTripSize = (Get-Item -LiteralPath $roundTrip).Length
              Remove-Item -LiteralPath $roundTrip -Force
              if ($roundTripHash -ne $hash -or $roundTripSize -ne $size) {
                throw "Delta patch from release $baseNumber does not reproduce the published executable."
              }

              return [pscustomobject]@{
                sha256 = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
                sizeBytes = (Get-Item -LiteralPath $patch).Length
              }
            } -ArgumentList $tool, $base.executablePath, ([int]$base.releaseNumber), $exe,
                            (Join-Path $artifactDir $assetName),
                            (Join-Path $env:RUNNER_TEMP "LANMinecraft.delta-roundtrip-$($base.releaseNumber).exe"),
                            $hash, $size
          }

          $deltaManifests = [System.Collections.Generic.List[object]]::new()
          if ($deltaJobs.Count -gt 0) { Wait-Job -Job $deltaJobs | Out-Null }
          for ($index = 0; $index -lt $deltaJobs.Count; $index++) {
            $job = $deltaJobs[$index]
            $patched = Receive-Job -Job $job -ErrorAction Continue
            if ($job.State -eq 'Failed') {
              throw "A delta patch failed in '$($job.Name)': $($job.ChildJobs[0].JobStateInfo.Reason.Message)"
            }
            $base = $bases[$index]
            $assetName = if ($index -eq 0) {
              'LANMinecraft.bsdiff'
            } else {
              "LANMinecraft.from-$($base.releaseNumber).bsdiff"
            }
            $deltaManifests.Add([ordered]@{
              algorithm = 'bsdiff'
              algorithmVersion = 1
              baseReleaseNumber = [int]$base.releaseNumber
              baseCommitSha = [string]$base.commitSha
              baseSha256 = [string]$base.sha256
              assetName = $assetName
              sha256 = [string]$patched.sha256
              sizeBytes = [long]$patched.sizeBytes
            })
          }
          if ($deltaJobs.Count -gt 0) { Remove-Job -Job $deltaJobs }

          $manifest = [ordered]@{
            schemaVersion = 2
            commitSha = '${{ github.sha }}'
            releaseNumber = [int]$env:RELEASE_NUMBER
            version = [string]$env:RELEASE_NUMBER
            publishedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            assetName = 'LANMinecraft.exe'
            sha256 = $hash
            sizeBytes = $size
            deltaPatches = @($deltaManifests)
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $artifactDir 'update.json') -Encoding UTF8

          if ($null -ne $archive) {
            Wait-Job -Job $archive | Out-Null
            Receive-Job -Job $archive -ErrorAction Continue
            if ($archive.State -eq 'Failed') {
              throw "The previous release could not be archived: $($archive.ChildJobs[0].JobStateInfo.Reason.Message)"
            }
            Remove-Job -Job $archive
          }

      - name: Verify release contents
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $files = Get-ChildItem -LiteralPath $artifactDir -File
          $manifest = Get-Content -LiteralPath (Join-Path $artifactDir 'update.json') -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 2 -or $manifest.releaseNumber -lt 1 -or $manifest.assetName -ne 'LANMinecraft.exe') {
            throw "Update manifest is invalid."
          }

          $patches = @($manifest.deltaPatches)
          if ($patches.Count -gt 2) { throw "More than two delta patches were published." }
          $expected = @('LANMinecraft.exe', 'update.json')
          foreach ($patch in $patches) {
            if ($patch.algorithm -ne 'bsdiff' -or $patch.algorithmVersion -ne 1) {
              throw "Delta manifest algorithm is invalid."
            }
            if ($patch.assetName -notmatch '^LANMinecraft(?:\.from-[1-9][0-9]*)?\.bsdiff$') {
              throw "Delta asset name is invalid: $($patch.assetName)"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $artifactDir $patch.assetName) -PathType Leaf)) {
              throw "Delta manifest references a missing patch asset: $($patch.assetName)"
            }
            $expected += $patch.assetName
          }
          $expected = @($expected | Select-Object -Unique)
          $unexpected = $files.Name | Where-Object { $_ -notin $expected }
          $missing = $expected | Where-Object { $_ -notin $files.Name }
          if ($unexpected -or $missing -or $files.Count -ne $expected.Count) {
            throw "Release contents are invalid. Missing: $missing; unexpected: $unexpected"
          }

      - name: Publish latest release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The shared publisher routes every GitHub request through Invoke-Gh.
          $scanRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\portable-host-antivirus'
          $scans = @(Get-ChildItem -LiteralPath $scanRoot -Filter scan.json -File -Recurse)
          if ($scans.Count -ne 1) { throw 'Antivirus evidence is missing or ambiguous.' }
          & .\.github\scripts\Publish-LatestRelease.ps1 `
            -AssetDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts') `
            -Repository '${{ github.repository }}' -CommitSha '${{ github.sha }}' `
            -ReleaseNumber ([int]$env:RELEASE_NUMBER) -AntivirusEvidencePath $scans[0].FullName -AllowUnavailableHostedDefender -Publish

      - name: Prepare exact candidate
        if: failure() && steps.publish.outcome == 'failure' && steps.antivirus.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $candidate = Join-Path $artifactDir 'private-candidate'
          $assets = Join-Path $candidate 'assets'
          $antivirus = Join-Path $candidate 'antivirus'
          [void][IO.Directory]::CreateDirectory($assets)
          [void][IO.Directory]::CreateDirectory($antivirus)
          $manifest = Get-Content -LiteralPath (Join-Path $artifactDir 'update.json') -Raw | ConvertFrom-Json
          $names = @('LANMinecraft.exe', 'update.json') + @($manifest.deltaPatches | ForEach-Object assetName)
          $inventory = @(foreach ($name in $names) {
            if ($name -notmatch '^(?:LANMinecraft\.exe|update\.json|LANMinecraft(?:\.from-[1-9][0-9]*)?\.bsdiff)$') { throw 'Unsafe candidate asset name.' }
            $source = Join-Path $artifactDir $name
            [IO.File]::Copy($source, (Join-Path $assets $name), $false)
            [ordered]@{ name = $name; sizeBytes = ([IO.FileInfo]::new($source)).Length; sha256 = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant() }
          })
          $scanRoot = Join-Path $artifactDir 'portable-host-antivirus'
          $scans = @(Get-ChildItem -LiteralPath $scanRoot -Filter scan.json -File -Recurse -ErrorAction SilentlyContinue)
          $scanPath = Join-Path $antivirus 'scan.json'
          if ($scans.Count -ne 1) { throw 'Candidate cannot be promoted without exactly one original CI scan record.' }
          [IO.File]::Copy($scans[0].FullName, $scanPath, $false)
          [ordered]@{
            schemaVersion = 1; repository = '${{ github.repository }}'; commitSha = '${{ github.sha }}'
            releaseNumber = [int]$env:RELEASE_NUMBER; runId = [long]'${{ github.run_id }}'; runAttempt = [int]'${{ github.run_attempt }}'
            ciScanSha256 = (Get-FileHash -LiteralPath $scanPath).Hash.ToLowerInvariant(); assets = $inventory
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $candidate 'candidate.json') -Encoding utf8

      - name: Upload exact candidate
        if: failure() && steps.publish.outcome == 'failure' && steps.antivirus.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: portable-host-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/private-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
