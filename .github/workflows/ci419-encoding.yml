name: Diagnose 419 native Windows Java encoding
on:
  push:
    branches:
      - codex/ci-419-encoding
permissions:
  contents: read
jobs:
  encoding:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Runner and Java charset metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/ci-419-encoding -Force | Out-Null
          [ordered]@{
            SystemLocale = (Get-WinSystemLocale).Name
            Culture = (Get-Culture).Name
            OsVersion = [Environment]::OSVersion.VersionString
            JavaHome = $env:JAVA_HOME
          } | ConvertTo-Json | Set-Content artifacts/ci-419-encoding/runner.json -Encoding utf8
          & "$env:JAVA_HOME/bin/java.exe" -XshowSettings:properties -version 2>&1 | Set-Content artifacts/ci-419-encoding/java-settings.txt -Encoding utf8
          dotnet --info | Set-Content artifacts/ci-419-encoding/dotnet-info.txt -Encoding utf8
      - name: Restore exact original project dependencies
        shell: pwsh
        run: |
          dotnet restore tools/PortabilityAuditHost/PortabilityAuditHost.csproj -r win-x64 -p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { throw 'Host restore failed.' }
          dotnet restore Program/Minecraft.csproj -r win-x64 -p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { throw 'Launcher restore failed.' }
          dotnet restore Program.Tests/Program.Tests.csproj -r win-x64 -p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { throw 'Tests restore failed.' }
      - name: Run the two unchanged assertions and capture native baseline
        shell: pwsh
        run: |
          dotnet test Program.Tests/Program.Tests.csproj -c Debug --no-restore --filter 'FullyQualifiedName~FinalJvmArgumentsTests.ActualCmlLoggingDefaultAndPackChoiceReachTheJvmWithCorrectPrecedence' --logger 'trx;LogFileName=encoding.trx' --results-directory artifacts/ci-419-encoding/trx
          if ($LASTEXITCODE -ne 0) { throw 'Original strict assertion reproduced a failure; inspect diagnostic artifact.' }
      - name: Upload bounded diagnostic output even on original assertion failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-419-native-encoding
          path: artifacts/ci-419-encoding/
          retention-days: 5
          if-no-files-found: error
